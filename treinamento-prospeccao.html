    async function verificarAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }

      const { data: perfil } = await supabaseClient
        .from('perfis').select('*').eq('id', session.user.id).single();

      const { data: cargos } = await supabaseClient.from('cargos').select('*');
      const meuCargo = (cargos || []).find(c => c.id === perfil?.cargo_id);
      const isAdmin = meuCargo?.is_admin === true;

      // Se NÃO for admin, esconde a aba do manual admin
      if (!isAdmin) {
        $('tabAdminBtn')?.classList.add('hidden');
      }
    }

    /* ==========================================================
       RENDERIZAÇÃO DOS MANUAIS
       ========================================================== */
    function renderManual(containerId, contentHTML, tocId) {
      const container = $(containerId);
      if (!container) return;

      container.innerHTML = contentHTML;

      // Constrói o índice
      const headers = container.querySelectorAll('h2');
      const toc = $(tocId);
      if (toc) {
        toc.innerHTML = Array.from(headers).map(h => `
          <a href="#${h.id}" data-target="${h.id}" class="toc-link">${h.textContent}</a>
        `).join('');

        // Scroll suave ao clicar
        toc.querySelectorAll('.toc-link').forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            const target = document.getElementById(link.dataset.target);
            if (target) {
              target.scrollIntoView({ behavior: 'smooth', block: 'start' });
              history.replaceState(null, '', `#${link.dataset.target}`);
            }
          });
        });

        // Marca o link ativo conforme o scroll
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              toc.querySelectorAll('.toc-link').forEach(l => l.classList.remove('active'));
              const active = toc.querySelector(`[data-target="${entry.target.id}"]`);
              active?.classList.add('active');
            }
          });
        }, { rootMargin: '-100px 0px -70% 0px', threshold: 0 });

        headers.forEach(h => observer.observe(h));
      }
    }

        }
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // CSS para as abas
    const style = document.createElement('style');
    style.textContent = `
      .tab-treino.active { border-color: #0e8890; color: #0e8890; background: rgba(14,136,144,0.06); }
      .tab-treino:not(.active) { border-color: transparent; }
    `;
    document.head.appendChild(style);


    /* ==========================================================
       CONCLUSÃO DO TREINAMENTO
       ========================================================== */
    let _stateConclusao = { consultor: false, admin: false, adminData: null, consultorData: null };

    async function verificarConclusao() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;

      const { data } = await supabaseClient
        .from('treinamentos_concluidos')
        .select('concluido_em')
        .eq('user_id', session.user.id)
        .eq('modulo', 'prospeccao')
        .maybeSingle();

      _stateConclusao.concluido = !!data;
      _stateConclusao.data = data?.concluido_em || null;

      renderBotoesConclusao();
    }

    function renderBotoesConclusao() {
      const concluido = _stateConclusao.concluido;
      const data = _stateConclusao.data;

      const html = concluido
        ? `
          <div class="concluido-badge">
            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
            Treinamento Concluído
          </div>
          <p style="margin-top: 1rem; font-size: 0.75rem; color: #065f46; font-weight: 700;">
            ✓ Você finalizou este treinamento em ${data ? new Date(data).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }) : '—'}
          </p>`
        : `
          <h3>Finalizou o treinamento?</h3>
          <p>Se você leu todo o conteúdo e se sente confiante para usar o módulo de Prospecção, marque como concluído. O administrador será notificado.</p>
          <button onclick="marcarConcluido(this)" class="btn-concluir">
            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
            Marcar como Concluído
          </button>`;

      ['conclusao-consultor', 'conclusao-admin'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.innerHTML = html;
          el.classList.toggle('concluido', concluido);
        }
      });

      if (window.lucide) lucide.createIcons();
    }

    async function marcarConcluido(btn) {
      if (!confirm('Confirmar conclusão do treinamento?\n\nVocê está declarando que leu todo o conteúdo e entendeu o funcionamento do módulo.')) return;

      const htmlOriginal = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Salvando…';
      lucide.createIcons();

      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) throw new Error('Sem sessão ativa');

        const { error } = await supabaseClient
          .from('treinamentos_concluidos')
          .insert({
            user_id: session.user.id,
            modulo: 'prospeccao',
          });

        if (error) {
          // Se já existe, considera como concluído
          if (error.code === '23505') {
            await verificarConclusao();
            return;
          }
          throw error;
        }

        _stateConclusao.concluido = true;
        _stateConclusao.data = new Date().toISOString();
        renderBotoesConclusao();

      } catch (err) {
        alert('Erro ao salvar: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = htmlOriginal;
        lucide.createIcons();
      }
    }
    
    /* ==========================================================
       BOOT
       ========================================================== */
    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      await verificarAuth();

      renderManual('conteudo-consultor', MANUAL_CONSULTOR, 'toc-consultor');
      renderManual('conteudo-admin', MANUAL_ADMIN, 'toc-admin');

      // Marca a aba consultor como ativa desde o início
      trocarAba('consultor');

      // Verifica se já concluiu o treinamento
      await verificarConclusao();

      lucide.createIcons();
    });
  </script>
</body>
</html>
